<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입출하 질의응답</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6eb; --accent:#2457c5; --me:#e8eefc;
          --ok:#18794e; --ok-bg:#e6f4ec; --warn:#a15c07; --warn-bg:#fef3e2; --bad:#b42318; --bad-bg:#fdecea; --code:#f1f3f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3340;
          --accent:#7aa2ff; --me:#22304d; --ok:#5fd49a; --ok-bg:#163326; --warn:#f5b54a; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3a1a18; --code:#232934; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
         display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:17px; } .sub { color:var(--muted); font-size:12px; }
  .mode { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  #log { overflow-y:auto; padding:16px; max-width:900px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; padding:10px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  .me { background:var(--me); margin-left:15%; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; margin-right:6px; }
  .ANSWERED { color:var(--ok); background:var(--ok-bg); } .INSUFFICIENT { color:var(--warn); background:var(--warn-bg); } .REFUSED { color:var(--bad); background:var(--bad-bg); }
  .cite { display:inline-block; margin:4px 4px 0 0; padding:1px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; cursor:pointer; color:var(--accent); background:transparent; font-family:inherit; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  details { margin-top:6px; font-size:12px; } pre { background:var(--code); padding:8px; border-radius:6px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; margin:4px 0; }
  .guard { color:var(--bad); font-size:12px; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:10px 16px; }
  .row { display:flex; gap:8px; max-width:900px; margin:0 auto; }
  input { flex:1; min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button.send { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  .ex { max-width:900px; margin:6px auto 0; display:flex; gap:6px; flex-wrap:wrap; }
  .ex button { font-size:12px; padding:3px 8px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--muted); cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<header><h1>입출하 질의응답 <span class="mode" id="mode"></span></h1>
  <div class="sub">수량·날짜는 읽기 전용 DB, 절차는 문서 검색으로만 답합니다. 근거가 없으면 답을 보류합니다.</div></header>
<main id="log"></main>
<footer>
  <form class="row" id="f"><input id="q" placeholder="예: LOT M-A는 언제 입고됐고 어디로 출하됐나?" autocomplete="off"><button class="send">질문</button></form>
  <div class="ex" id="ex"></div>
</footer>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {ANSWERED: "답변", INSUFFICIENT: "근거 부족 · 보류", REFUSED: "거절"};
function add(html, cls) { const d = document.createElement("div"); d.className = "msg " + (cls || ""); d.innerHTML = html; $("#log").appendChild(d); d.scrollIntoView({block: "end"}); return d; }
async function ask(q) {
  add(esc(q), "me");
  const wait = add('<span class="sub">조회 중…</span>');
  const r = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: q})});
  const d = await r.json();
  if (!r.ok) { wait.innerHTML = `<span class="guard">${esc(d.message)}</span>`; return; }
  const tools = d.tool_calls.map(t => `<pre>${esc(t.name)} ${esc(JSON.stringify(t.input))}\n→ ${t.ok ? "성공" : "실패"} · 근거 ${esc(t.refs.join(", ") || "-")} · ${t.ms}ms\n${esc(t.output_preview)}</pre>`).join("");
  wait.innerHTML = `<span class="badge ${d.status}">${LABEL[d.status]}</span>${esc(d.answer)}
    <div>${d.citations.map(c => `<button class="cite" data-ref="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${d.guards.length ? `<div class="guard">코드 가드: ${esc(d.guards.join(" / "))}</div>` : ""}
    <div class="meta">응답 ${d.latency_s}s · API ${d.api_calls}회 · 도구 ${d.tool_calls.length}회 · 토큰 입력 ${d.usage.input}/출력 ${d.usage.output}/캐시읽기 ${d.usage.cache_read} · 비용 $${d.cost_usd}</div>
    <details><summary>도구 로그</summary>${tools || "없음"}</details><div class="refbox"></div>`;
}
$("#log").addEventListener("click", async e => {
  const b = e.target.closest(".cite"); if (!b) return;
  const r = await fetch(`/api/ref?ref=${encodeURIComponent(b.dataset.ref)}`); const d = await r.json();
  b.closest(".msg").querySelector(".refbox").innerHTML = `<pre>${esc(b.dataset.ref)}\n${esc(JSON.stringify(d, null, 1))}</pre>`;
});
$("#f").addEventListener("submit", e => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { $("#q").value = ""; ask(q); } });
fetch("/api/info").then(r => r.json()).then(i => {
  const m = $("#mode"); m.textContent = i.backend === "claude" ? i.model : `모의 모드(${i.backend}) — AI 아님`;
  m.style.cssText = i.backend === "claude" ? "color:var(--ok);background:var(--ok-bg)" : "color:var(--warn);background:var(--warn-bg)";
  $("#ex").innerHTML = i.examples.filter((_, k) => k % 2 === 0).map(x => `<button data-q="${esc(x.question)}">${esc(x.id)}</button>`).join("");
  $("#ex").addEventListener("click", e => { const b = e.target.closest("button"); if (b) ask(b.dataset.q); });
});
</script>
</body>
</html>
