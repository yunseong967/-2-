<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공정 현황판</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6eb; --accent:#2457c5;
          --ok:#18794e; --ok-bg:#e6f4ec; --run:#2457c5; --run-bg:#e8eefc; --warn:#a15c07; --warn-bg:#fef3e2; --bad:#b42318; --bad-bg:#fdecea; --idle:#475467; --idle-bg:#eef0f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3340; --accent:#7aa2ff;
          --ok:#5fd49a; --ok-bg:#163326; --run:#7aa2ff; --run-bg:#1d2a45; --warn:#f5b54a; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3a1a18; --idle:#c0c6d0; --idle-bg:#262c36; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  h1 { margin:0; font-size:17px; } .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--muted); }
  input, button { padding:6px 9px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); font:inherit; font-size:13px; }
  button { cursor:pointer; } button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { padding:16px; max-width:1280px; margin:0 auto; display:grid; gap:14px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; }
  h2 { margin:0 0 8px; font-size:14px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { border:1px solid var(--line); border-radius:8px; padding:8px 10px; } .tile .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; } .tile .s { color:var(--muted); font-size:12px; }
  .devs { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
  .dev { border:1px solid var(--line); border-radius:8px; padding:10px; } .dev.stale { border-color:var(--bad); box-shadow:0 0 0 1px var(--bad); }
  .dev h3 { margin:0 0 4px; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:12px; } .kv span:nth-child(odd) { color:var(--muted); }
  .chip { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .OK, .DONE { color:var(--ok); background:var(--ok-bg); } .RUNNING { color:var(--run); background:var(--run-bg); }
  .STOPPED { color:var(--warn); background:var(--warn-bg); } .STALE, .NO_DATA, .UNKNOWN { color:var(--bad); background:var(--bad-bg); } .WAITING { color:var(--idle); background:var(--idle-bg); }
  table { border-collapse:collapse; width:100%; font-size:13px; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; } .cell { display:grid; gap:2px; min-width:150px; }
  .muted { color:var(--muted); font-size:12px; } .late { color:var(--bad); font-size:12px; font-weight:600; } .flag { color:var(--warn); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>공정 현황판 <span class="muted" id="mode"></span></h1>
  <div class="bar">기준 시각 <input id="now" type="datetime-local" step="60">
    <button data-t="2026-11-02T10:18">10:18 검사기 단절</button><button data-t="2026-11-02T20:05">20:05 복구 전</button>
    <button data-t="2026-11-02T20:15">20:15 복구 후</button><button id="live">실시간</button></div>
  <div class="muted" id="clock"></div>
</header>
<main>
  <section><h2>집계 <span class="muted">— 기준 시각까지 '수신된' 이벤트만으로 계산 (중복은 한 번만)</span></h2><div class="tiles" id="tiles"></div></section>
  <section><h2>설비 <span class="muted">— 발생시각(설비)과 수신시각(서버)을 따로 표시, 15분 넘게 수신이 없으면 미수신</span></h2><div class="devs" id="devs"></div></section>
  <section><h2>작업지시 × 공정</h2><div id="jobs"></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = {CUT: "가공", WELD: "용접", INSP: "검사"}, S = {WAITING: "대기", RUNNING: "가동", STOPPED: "정지", DONE: "완료", UNKNOWN: "미확인"};
const t = s => s ? s.slice(11, 16) : "-";
let fixed = null, timer = null;
async function load() {
  const r = await fetch("/api/state" + (fixed ? `?now=${encodeURIComponent(fixed)}` : "")); const d = await r.json();
  if (!r.ok) { $("#jobs").textContent = d.message; return; }
  $("#mode").textContent = d.sim ? "(시뮬레이션 시계)" : "";
  $("#clock").textContent = `기준 ${d.now.replace("T", " ")}`;
  const T = d.totals, I = d.ingest;
  const tile = (v, s) => `<div class="tile"><div class="v">${v}</div><div class="s">${s}</div></div>`;
  $("#tiles").innerHTML = tile(T.events.toLocaleString(), "저장된 이벤트")
    + tile(`${I.DUPLICATE || 0} / ${I.REJECTED || 0} / ${I.CONFLICT || 0}`, "중복 무시 / 형식 거부 / 충돌")
    + Object.keys(P).map(p => tile(`${T.good[p] || 0}<span class="muted"> / 불량 ${T.ng[p] || 0}</span>`, `${P[p]} 양품`)).join("");
  $("#devs").innerHTML = Object.values(d.devices).map(v => `<div class="dev ${v.link === "OK" ? "" : "stale"}">
    <h3>${esc(v.device_id)} <span class="chip ${v.link}">${v.link === "OK" ? "수신 정상" : v.link === "STALE" ? `미수신 ${Math.round(v.silent_min)}분` : "데이터 없음"}</span></h3>
    <div class="kv"><span>공정</span><span>${P[v.process]}</span>
      <span>현재 작업</span><span>${v.work ? `${esc(v.work.wo)} <span class="chip ${v.work.state}">${S[v.work.state]}</span>` : "없음"}</span>
      <span>마지막 발생</span><span>${t(v.last_occurred_at)}</span>
      <span>마지막 수신</span><span>${t(v.last_received_at)} <span class="muted">(마지막 갱신)</span></span>
      <span>누락 seq</span><span>${v.missing_seq ? `<span class="late">${v.missing_seq}건 ${esc(v.missing_ranges.slice(0, 3).join(", "))}</span>` : "0"}</span>
      <span>지연 수신</span><span>${v.late_receipts}건 <span class="muted">(발생 후 5분 넘게 늦게 도착)</span></span>
      <span>이벤트</span><span>${v.events}건 (seq 최대 ${v.max_seq})</span></div></div>`).join("");
  const by = {}; d.jobs.forEach(j => (by[j.wo] ||= {})[j.process] = j);
  $("#jobs").innerHTML = `<table><tr><th>작업지시</th>${Object.values(P).map(p => `<th>${p}</th>`).join("")}</tr>${Object.entries(by).map(([wo, ps]) =>
    `<tr><td><b>${esc(wo)}</b></td>${Object.keys(P).map(p => { const j = ps[p]; if (!j) return "<td>-</td>";
      return `<td><div class="cell"><span><span class="chip ${j.status}">${S[j.status]}</span> <span class="muted">${esc(j.device_id)}</span></span>
        <span>양품 ${j.good} · 불량 ${j.ng}${j.stops ? ` · 정지 ${j.stops}회 ${j.stop_min}분` : ""}</span>
        <span class="muted">계획 ${t(j.planned_start)}~${t(j.planned_end)} · 실적 ${t(j.started_at)}~${t(j.ended_at)}</span>
        ${j.delay_min > 0 ? `<span class="late">지연 ${Math.round(j.delay_min)}분</span>` : ""}
        ${j.flags.map(f => `<span class="flag">⚠ ${esc(f)}</span>`).join("")}</div></td>`; }).join("")}</tr>`).join("")}</table>`;
}
function setFixed(v) { fixed = v; $("#now").value = v || ""; document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === v)); $("#live").classList.toggle("on", !v); load(); }
document.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => setFixed(b.dataset.t)));
$("#live").addEventListener("click", () => setFixed(null));
$("#now").addEventListener("change", e => setFixed(e.target.value || null));
const q = new URLSearchParams(location.search).get("now");
setFixed(q); timer = setInterval(() => { if (!fixed) load(); }, 2000);
</script>
</body>
</html>
