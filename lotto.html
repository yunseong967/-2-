<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 번호 추첨기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 440px;
    width: 100%;
  }
  h1 { font-size: 26px; color: #333; margin-bottom: 6px; }
  .sub { color: #888; font-size: 14px; margin-bottom: 28px; }
  .balls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 56px;
    margin-bottom: 28px;
  }
  .ball {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: pop 0.4s ease both;
  }
  @keyframes pop {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .placeholder {
    width: 52px; height: 52px; border-radius: 50%;
    background: #eee;
  }
  button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    padding: 14px 40px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 40px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 18px rgba(118,75,162,0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(118,75,162,0.5); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: default; transform: none; }
  .history {
    margin-top: 26px;
    text-align: left;
    font-size: 13px;
    color: #777;
    max-height: 160px;
    overflow-y: auto;
  }
  .history-row { padding: 6px 0; border-top: 1px dashed #eee; }
</style>
</head>
<body>
  <div class="card">
    <h1>🍀 로또 번호 추첨기</h1>
    <p class="sub">1~45 중 6개를 무작위로 추첨합니다</p>
    <div class="balls" id="balls">
      <div class="placeholder"></div><div class="placeholder"></div>
      <div class="placeholder"></div><div class="placeholder"></div>
      <div class="placeholder"></div><div class="placeholder"></div>
    </div>
    <button id="drawBtn" onclick="draw()">번호 추첨하기</button>
    <div class="history" id="history"></div>
  </div>

<script>
  function ballColor(n) {
    if (n <= 10) return '#fbc400';
    if (n <= 20) return '#69c8f2';
    if (n <= 30) return '#ff7272';
    if (n <= 40) return '#aaa';
    return '#b0d840';
  }

  function pickNumbers() {
    const pool = Array.from({length: 45}, (_, i) => i + 1);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 6).sort((a, b) => a - b);
  }

  function draw() {
    const btn = document.getElementById('drawBtn');
    const container = document.getElementById('balls');
    btn.disabled = true;
    container.innerHTML = '';

    const nums = pickNumbers();
    nums.forEach((n, i) => {
      setTimeout(() => {
        const ball = document.createElement('div');
        ball.className = 'ball';
        ball.style.background = ballColor(n);
        ball.textContent = n;
        container.appendChild(ball);
        if (i === nums.length - 1) {
          btn.disabled = false;
          addHistory(nums);
        }
      }, i * 250);
    });
  }

  function addHistory(nums) {
    const h = document.getElementById('history');
    const row = document.createElement('div');
    row.className = 'history-row';
    const time = new Date().toLocaleTimeString('ko-KR');
    row.textContent = `${time}  →  ${nums.join(', ')}`;
    h.prepend(row);
  }
</script>
</body>
</html>
